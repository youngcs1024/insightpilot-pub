[project]
name = "insightpilot"
version = "0.1.0"
description = "Enterprise business operations analysis agent."
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp==2.1.1",
    "anyio==4.15.1",
    "httpx2==2.12.0",
    "langgraph==1.2.11",
    "langchain-core==1.6.2",
    "langgraph-checkpoint-postgres==3.1.2",
    "fastapi==0.141.1",
    "starlette==1.6.0",
    "uvicorn==0.52.4",
    "pydantic==2.12.5",
    "pydantic-core==2.41.5",
    "pydantic-settings==2.12.0",
    "sqlalchemy[asyncio]==2.0.52",
    "asyncpg==0.31.0",
    "psycopg[binary,pool]==3.3.5",
    "alembic==1.19.2",
    "langfuse==4.15.1",
    "opentelemetry-api==1.44.0",
    "opentelemetry-sdk==1.44.0",
    "opentelemetry-exporter-otlp-proto-http==1.44.0",
    "sqlglot[c]==30.18.0",
    "structlog==26.1.0",
    "slowapi==0.1.10",
    "tenacity==9.1.4",
    "httpx==0.28.1",
    "asgi-correlation-id==4.3.4",
    "pyjwt==2.13.0",
    "bcrypt==5.0.0",
    "email-validator==2.3.0",
    "limits==5.8.0",
    "pyyaml==6.0.3",
    "tiktoken==0.14.0",
    "jinja2==3.1.6",
    "pymilvus==3.0.1",
]

[build-system]
requires = ["hatchling==1.31.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.build.targets.sdist]
include = ["/app", "/pyproject.toml"]

[dependency-groups]
dev = [
    "ruff==0.16.6",
    "mypy==1.20.2",
    "deptry==0.25.1",
]
test = [
    "coverage==7.16.0",
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "testcontainers==4.15.0",
    "httpx==0.28.1",
    "respx==0.22.0",
]

[tool.uv]
required-version = "==0.11.32"
default-groups = ["dev", "test"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [
    "RagMate", "fastapi-langgraph-agent-production-ready-template",
    "langchain_data_agent", "langgraph-mcp",
]
force-exclude = true

[tool.ruff.lint]
allowed-confusables = ["，", "；", "（", "）"]
select = [
    "E", "F", "W", "B", "I", "N", "UP", "ANN", "S", "C4", "C90",
    "PT", "SIM", "TC", "ERA", "PERF", "PL", "RUF", "PLR1702",
]
ignore = ["E501"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-nested-blocks = 3

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
explicit_package_bases = true
plugins = ["pydantic.mypy"]
python_version = "3.12"
strict = true
files = ["evals", "data", "mcp_server", "alembic", "app", "model_tunnel", "model_runtime", "scripts", "spikes/capacity", "spikes/model_runtime", "spikes/mcp_v2", "spikes/provider", "spikes/provider_probe.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
filterwarnings = ["error"]
markers = [
    "integration: requires containers",
    "storage: requires the isolated Milvus stack (also integration)",
    "slow: long-running checks",
    "gpu: requires authorized real GPU runtime",
    "external: requires an authorized target host or private credentials",
]
addopts = "--strict-config --strict-markers -m 'not gpu and not external'"
xfail_strict = true

[tool.deptry]
extend_exclude = [
    "RagMate", "fastapi-langgraph-agent-production-ready-template",
    "langchain_data_agent", "langgraph-mcp",
]

# psycopg[pool] explicitly installs the imported pool module.
[tool.deptry.package_module_name_map]
psycopg = ["psycopg", "psycopg_pool"]

# Pydantic EmailStr loads this optional dependency dynamically.
[tool.deptry.per_rule_ignores]
DEP002 = ["email-validator"]

[tool.coverage.run]
relative_files = true
source = ["app"]
