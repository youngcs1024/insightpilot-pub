- id: nl2sql-null-discount-001
  question: 2025年12月各品类GMV是什么？商品行历史空优惠金额视为零，返回品类和数值两列，按品类名称升序。
  traps:
  - T6
  expected_bindings:
  - metric_key: gmv
    period:
      start: '2025-12-01T00:00:00+08:00'
      end: '2026-01-01T00:00:00+08:00'
      label: explicit evaluation interval
    filters:
    - o.paid_at IS NOT NULL
    - o.status <> 'cancelled'
    - c.is_test_account = false
    date_field: o.paid_at
  canonical_sql: |-
    SELECT p.category AS category, SUM(i.quantity*i.unit_price-COALESCE(i.item_discount,0)) AS gmv
    FROM biz.orders o JOIN biz.customers c USING (customer_id)
    JOIN biz.order_items i USING(order_id) JOIN biz.products p USING(product_id)
    WHERE o.paid_at >= TIMESTAMPTZ '2025-12-01 00:00:00+08'
      AND o.paid_at < TIMESTAMPTZ '2026-01-01 00:00:00+08'
      AND o.paid_at IS NOT NULL
      AND o.status <> 'cancelled'
      AND c.is_test_account = false
    GROUP BY 1
    ORDER BY 1;
  comparison: set_unordered
  tolerance: 0.001
