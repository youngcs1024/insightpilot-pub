- id: nl2sql-promo-001
  question: 2026年8月华东支付订单同期群，按是否参加17号促销分组，分别返回布尔标志与支付订单数两列。非17号含无促销订单。
  traps:
  - T7
  expected_bindings:
  - metric_key: order_count
    period:
      start: '2026-08-01T00:00:00+08:00'
      end: '2026-09-01T00:00:00+08:00'
      label: explicit evaluation interval
    filters:
    - o.paid_at IS NOT NULL
    - o.status <> 'cancelled'
    - c.is_test_account = false
    - o.region_id IN (3)
    date_field: o.paid_at
  canonical_sql: |-
    WITH cohort AS (
     SELECT o.order_id,o.promo_id,EXISTS (
      SELECT 1 FROM biz.refunds r WHERE r.order_id=o.order_id
      AND r.status <> 'rejected' AND r.requested_at < TIMESTAMPTZ '2026-12-15 00:00:00+08'
