- id: nl2sql-refund-001
  question: 2026年8月公司默认的退款申请订单率是多少？按申请时间归属分子，只返回一个比值列。
  traps:
  - T2
  expected_bindings:
  - metric_key: refund_rate
    period:
      start: '2026-08-01T00:00:00+08:00'
      end: '2026-09-01T00:00:00+08:00'
      label: explicit evaluation interval
    filters:
    - o.paid_at IS NOT NULL
    - o.status <> 'cancelled'
    - c.is_test_account = false
    - r.status <> 'rejected'
    date_field: r.requested_at
  canonical_sql: |-
    WITH n AS (
     SELECT COUNT(DISTINCT o.order_id)::numeric AS refunds
     FROM biz.refunds r JOIN biz.orders o USING(order_id) JOIN biz.customers c USING(customer_id)
     WHERE r.requested_at >= TIMESTAMPTZ '2026-08-01 00:00:00+08'
      AND r.requested_at < TIMESTAMPTZ '2026-09-01 00:00:00+08'
      AND o.paid_at IS NOT NULL
      AND o.status <> 'cancelled'
      AND c.is_test_account = false
      AND r.status <> 'rejected'
    ), d AS (
     SELECT COUNT(DISTINCT o.order_id) AS orders
     FROM biz.orders o JOIN biz.customers c USING(customer_id)
     WHERE o.paid_at >= TIMESTAMPTZ '2026-08-01 00:00:00+08'
      AND o.paid_at < TIMESTAMPTZ '2026-09-01 00:00:00+08'
      AND o.paid_at IS NOT NULL
      AND o.status <> 'cancelled'
      AND c.is_test_account = false
    )
    SELECT n.refunds / NULLIF(d.orders,0) AS refund_rate FROM n CROSS JOIN d;
  comparison: scalar_numeric
  tolerance: 0.001
