- id: nl2sql-cancelled-001
  question: 2026年8月按公司口径统计GMV，返回一个数值列，不返回固定的total标签。
  traps:
  - T1
  expected_bindings:
  - metric_key: gmv
    period:
      start: '2026-08-01T00:00:00+08:00'
      end: '2026-09-01T00:00:00+08:00'
      label: explicit evaluation interval
    filters:
    - o.paid_at IS NOT NULL
    - o.status <> 'cancelled'
    - c.is_test_account = false
    date_field: o.paid_at
  canonical_sql: |-
    SELECT SUM(o.gross_amount - COALESCE(o.discount_amount,0)) AS gmv
    FROM biz.orders o JOIN biz.customers c USING (customer_id)
    WHERE o.paid_at >= TIMESTAMPTZ '2026-08-01 00:00:00+08'
      AND o.paid_at < TIMESTAMPTZ '2026-09-01 00:00:00+08'
      AND o.paid_at IS NOT NULL
      AND o.status <> 'cancelled'
      AND c.is_test_account = false;
  comparison: scalar_numeric
  tolerance: 0.001
