tables:
- table_name: biz.regions
  description: 销售区域维表
  notes:
  - 所有时间均为 TIMESTAMPTZ；业务时区 Asia/Shanghai，区间为[start,end)。
  - 华东与华东一区解析为稳定 region_id=3；改名不截断历史订单。
  columns:
  - column_name: region_id
    sql_type: integer
    ordinal_position: 1
    nullable: false
    is_primary_key: true
    fk_table: null
    fk_column: null
    constraints:
    - name: pk_regions
      kind: p
      definition: PRIMARY KEY (region_id)
      columns:
      - region_id
    description: 区域ID
    semantic_type: identifier
    allowed_values: {}
    is_pii: false
    sample_values: []
    notes: []
  - column_name: name
    sql_type: character varying(40)
    ordinal_position: 2
    nullable: false
    is_primary_key: false
    fk_table: null
    fk_column: null
    constraints:
    - name: ck_regions_rename
      kind: c
      definition: CHECK (((renamed_from IS NULL) OR ((renamed_from)::text <> (name)::text)))
      columns:
      - renamed_from
      - name
    - name: uq_regions_name
      kind: u
      definition: UNIQUE (name)
      columns:
      - name
    description: 当前中文名
    semantic_type: text
    allowed_values: {}
    is_pii: false
    sample_values:
    - 华东一区
    notes: []
  - column_name: name_en
    sql_type: character varying(80)
    ordinal_position: 3
    nullable: false
    is_primary_key: false
    fk_table: null
    fk_column: null
    constraints:
    - name: uq_regions_name_en
      kind: u
      definition: UNIQUE (name_en)
      columns:
      - name_en
    description: 英文名
    semantic_type: text
    allowed_values: {}
    is_pii: false
    sample_values: []
    notes: []
  - column_name: renamed_from
    sql_type: character varying(40)
    ordinal_position: 4
    nullable: true
    is_primary_key: false
    fk_table: null
    fk_column: null
    constraints:
    - name: ck_regions_rename
      kind: c
      definition: CHECK (((renamed_from IS NULL) OR ((renamed_from)::text <> (name)::text)))
      columns:
      - renamed_from
      - name
    description: 更名前名称
    semantic_type: text
    allowed_values: {}
    is_pii: false
    sample_values:
    - 华东
    notes: []
  - column_name: effective_from
    sql_type: timestamp with time zone
    ordinal_position: 5
