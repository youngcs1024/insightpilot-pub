- table_name: biz.orders
  description: 客户订单主表，一行一单
  notes:
  - 所有时间均为 TIMESTAMPTZ；业务时区 Asia/Shanghai，区间为[start,end)。
  - GMV=SUM(gross_amount-discount_amount)，按 paid_at 统计，排除取消订单和测试账号，不扣退款、不含运费。
  - 销售分组用 orders.region_id；未支付订单 paid_at 为 NULL。
  columns:
  - column_name: order_id
    sql_type: bigint
    ordinal_position: 1
    nullable: false
    is_primary_key: true
    fk_table: null
    fk_column: null
    constraints:
    - name: pk_orders
      kind: p
      definition: PRIMARY KEY (order_id)
      columns:
      - order_id
    description: 订单ID
    semantic_type: identifier
    allowed_values: {}
    is_pii: false
    sample_values: []
    notes: []
  - column_name: customer_id
    sql_type: bigint
    ordinal_position: 2
    nullable: false
    is_primary_key: false
    fk_table: biz.customers
    fk_column: customer_id
    constraints:
    - name: fk_orders_customer_id_customers
      kind: f
      definition: FOREIGN KEY (customer_id) REFERENCES biz.customers(customer_id) ON DELETE RESTRICT
      columns:
      - customer_id
    description: 客户ID
    semantic_type: foreign_key
    allowed_values: {}
    is_pii: false
    sample_values: []
    notes: []
  - column_name: region_id
    sql_type: integer
    ordinal_position: 3
    nullable: false
    is_primary_key: false
    fk_table: biz.regions
    fk_column: region_id
    constraints:
    - name: fk_orders_region_id_regions
      kind: f
      definition: FOREIGN KEY (region_id) REFERENCES biz.regions(region_id) ON DELETE RESTRICT
      columns:
      - region_id
    description: 下单区域
    semantic_type: foreign_key
    allowed_values: {}
    is_pii: false
    sample_values: []
    notes: []
  - column_name: created_at
    sql_type: timestamp with time zone
    ordinal_position: 4
    nullable: false
    is_primary_key: false
    fk_table: null
    fk_column: null
    constraints:
    - name: ck_orders_paid_time
      kind: c
      definition: CHECK (((paid_at IS NULL) OR (paid_at >= created_at)))
      columns:
      - paid_at
      - created_at
    description: 创建时间
    semantic_type: timestamp
    allowed_values: {}
    is_pii: false
    sample_values: []
    notes: []
  - column_name: paid_at
    sql_type: timestamp with time zone
    ordinal_position: 5
    nullable: true
    is_primary_key: false
    fk_table: null
    fk_column: null
    constraints:
    - name: ck_orders_paid_time
      kind: c
      definition: CHECK (((paid_at IS NULL) OR (paid_at >= created_at)))
      columns:
      - paid_at
      - created_at
    - name: ck_orders_payment
      kind: c
      definition: CHECK (((((status)::text = 'created'::text) AND (paid_at IS NULL)) OR (((status)::text
        <> 'created'::text) AND (paid_at IS NOT NULL))))
      columns:
      - status
      - paid_at
    description: 支付完成时间
    semantic_type: timestamp
    allowed_values: {}
    is_pii: false
    sample_values: []
    notes: []
  - column_name: status
    sql_type: character varying(16)
    ordinal_position: 6
    nullable: false
    is_primary_key: false
    fk_table: null
    fk_column: null
    constraints:
    - name: ck_orders_payment
      kind: c
      definition: CHECK (((((status)::text = 'created'::text) AND (paid_at IS NULL)) OR (((status)::text
        <> 'created'::text) AND (paid_at IS NOT NULL))))
      columns:
      - status
      - paid_at
    - name: ck_orders_status
      kind: c
      definition: CHECK (((status)::text = ANY ((ARRAY['created'::character varying, 'paid'::character
        varying, 'shipped'::character varying, 'delivered'::character varying, 'cancelled'::character
        varying, 'closed'::character varying])::text[])))
      columns:
      - status
    description: 订单状态
    semantic_type: enum
    allowed_values:
      created: 已创建
      paid: 已支付
      shipped: 已发货
      delivered: 已签收
      cancelled: 已取消
      closed: 已关闭
    is_pii: false
    sample_values: []
    notes: []
  - column_name: gross_amount
    sql_type: numeric(12,2)
    ordinal_position: 7
    nullable: false
    is_primary_key: false
    fk_table: null
    fk_column: null
    constraints:
    - name: ck_orders_amount
      kind: c
      definition: CHECK (((gross_amount >= (0)::numeric) AND (discount_amount >= (0)::numeric) AND (discount_amount
        <= gross_amount) AND (shipping_fee >= (0)::numeric)))
      columns:
      - gross_amount
      - discount_amount
      - shipping_fee
    description: 商品总额，未扣优惠，不含运费
    semantic_type: money
    allowed_values: {}
    is_pii: false
    sample_values: []
    notes: []
  - column_name: discount_amount
    sql_type: numeric(12,2)
    ordinal_position: 8
    nullable: false
    is_primary_key: false
    fk_table: null
    fk_column: null
    constraints:
    - name: ck_orders_amount
      kind: c
      definition: CHECK (((gross_amount >= (0)::numeric) AND (discount_amount >= (0)::numeric) AND (discount_amount
        <= gross_amount) AND (shipping_fee >= (0)::numeric)))
      columns:
      - gross_amount
      - discount_amount
      - shipping_fee
    description: 优惠总额
    semantic_type: money
    allowed_values: {}
    is_pii: false
    sample_values: []
    notes: []
  - column_name: shipping_fee
    sql_type: numeric(12,2)
    ordinal_position: 9
    nullable: false
    is_primary_key: false
    fk_table: null
    fk_column: null
    constraints:
    - name: ck_orders_amount
      kind: c
      definition: CHECK (((gross_amount >= (0)::numeric) AND (discount_amount >= (0)::numeric) AND (discount_amount
        <= gross_amount) AND (shipping_fee >= (0)::numeric)))
      columns:
      - gross_amount
      - discount_amount
      - shipping_fee
    description: 运费
    semantic_type: money
    allowed_values: {}
    is_pii: false
    sample_values: []
    notes: []
  - column_name: promo_id
    sql_type: integer
    ordinal_position: 10
    nullable: true
    is_primary_key: false
    fk_table: biz.promotions
    fk_column: promo_id
    constraints:
    - name: fk_orders_promo_id_promotions
      kind: f
      definition: FOREIGN KEY (promo_id) REFERENCES biz.promotions(promo_id) ON DELETE RESTRICT
      columns:
      - promo_id
    description: 关联促销ID
    semantic_type: foreign_key
    allowed_values: {}
    is_pii: false
    sample_values: []
    notes: []
- table_name: biz.order_items
  description: 订单商品明细
  notes:
  - 所有时间均为 TIMESTAMPTZ；业务时区 Asia/Shanghai，区间为[start,end)。
  - 历史 item_discount 为 NULL 时按0处理：SUM(unit_price*quantity-COALESCE(item_discount,0))，不得直接相减导致漏计。
  columns:
  - column_name: order_item_id
    sql_type: bigint
    ordinal_position: 1
    nullable: false
    is_primary_key: true
    fk_table: null
    fk_column: null
    constraints:
    - name: pk_order_items
      kind: p
      definition: PRIMARY KEY (order_item_id)
      columns:
      - order_item_id
    description: 明细ID
    semantic_type: identifier
    allowed_values: {}
    is_pii: false
    sample_values: []
    notes: []
  - column_name: order_id
    sql_type: bigint
    ordinal_position: 2
    nullable: false
    is_primary_key: false
    fk_table: biz.orders
    fk_column: order_id
    constraints:
    - name: fk_order_items_order_id_orders
      kind: f
      definition: FOREIGN KEY (order_id) REFERENCES biz.orders(order_id) ON DELETE RESTRICT
      columns:
      - order_id
    - name: uq_order_items_order_id
      kind: u
      definition: UNIQUE (order_id, product_id)
      columns:
      - order_id
      - product_id
    description: 订单ID
    semantic_type: foreign_key
    allowed_values: {}
    is_pii: false
    sample_values: []
    notes: []
  - column_name: product_id
    sql_type: bigint
    ordinal_position: 3
    nullable: false
    is_primary_key: false
    fk_table: biz.products
    fk_column: product_id
    constraints:
    - name: fk_order_items_product_id_products
      kind: f
      definition: FOREIGN KEY (product_id) REFERENCES biz.products(product_id) ON DELETE RESTRICT
      columns:
      - product_id
    - name: uq_order_items_order_id
      kind: u
      definition: UNIQUE (order_id, product_id)
      columns:
      - order_id
      - product_id
    description: 商品ID
    semantic_type: foreign_key
    allowed_values: {}
    is_pii: false
    sample_values: []
    notes: []
  - column_name: quantity
    sql_type: integer
    ordinal_position: 4
    nullable: false
    is_primary_key: false
    fk_table: null
    fk_column: null
    constraints:
    - name: ck_order_items_amount
      kind: c
      definition: CHECK (((quantity > 0) AND (unit_price > (0)::numeric) AND ((item_discount IS NULL)
        OR ((item_discount >= (0)::numeric) AND (item_discount <= ((quantity)::numeric * unit_price))))))
      columns:
      - quantity
      - unit_price
